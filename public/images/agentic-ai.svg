<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgAI)" rx="16" />

  <!-- Connecting circuits / agent nodes -->
  <g stroke="#6366f1" stroke-width="2" opacity="0.6" stroke-dasharray="4,4">
    <line x1="400" y1="130" x2="220" y2="280" />
    <line x1="400" y1="130" x2="580" y2="280" />
    <line x1="220" y1="280" x2="400" y2="360" />
    <line x1="580" y1="280" x2="400" y2="360" />
  </g>

  <!-- Central Orchestrator Node -->
  <circle cx="400" cy="130" r="50" fill="url(#nodeGrad)" />
  <text x="400" y="136" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="bold" font-size="14" text-anchor="middle">ORCHESTRATOR</text>

  <!-- Worker 1: Planning -->
  <rect x="140" y="250" width="160" height="60" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <text x="220" y="285" fill="#38bdf8" font-family="-apple-system, sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Task Planner (ReAct)</text>

  <!-- Worker 2: Tool Execution -->
  <rect x="500" y="250" width="160" height="60" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="2" />
  <text x="580" y="285" fill="#c084fc" font-family="-apple-system, sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Tool Sandbox</text>

  <!-- Reflection node -->
  <rect x="310" y="335" width="180" height="50" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
  <text x="400" y="365" fill="#4ade80" font-family="-apple-system, sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Reflection &amp; Memory</text>
</svg>
