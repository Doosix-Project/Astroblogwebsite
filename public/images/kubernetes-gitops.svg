<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgK8s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgK8s)" rx="16" />
  <circle cx="400" cy="225" r="140" fill="white" opacity="0.04" />
  <!-- Git to Cluster visualization -->
  <rect x="120" y="165" width="180" height="120" rx="12" fill="#0f172a" stroke="#60a5fa" stroke-width="2" />
  <text x="210" y="215" fill="#93c5fd" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">Git Repository</text>
  <text x="210" y="245" fill="#64748b" font-family="monospace" font-size="12" text-anchor="middle">main: git push</text>

  <!-- Sync arrow -->
  <path d="M330 225 L470 225 M450 205 L470 225 L450 245" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text x="400" y="200" fill="#bae6fd" font-family="monospace" font-size="13" text-anchor="middle">ArgoCD Sync</text>

  <!-- Kubernetes cluster box -->
  <rect x="500" y="165" width="200" height="120" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  <text x="600" y="215" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">K8s Cluster</text>
  <text x="600" y="245" fill="#4ade80" font-family="monospace" font-size="12" text-anchor="middle">✔ Synced (Healthy)</text>
</svg>
