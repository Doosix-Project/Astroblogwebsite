<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDocker" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgDocker)" rx="16" />
  <!-- Before and After comparison -->
  <g transform="translate(140, 100)">
    <rect x="0" y="0" width="220" height="250" rx="14" fill="#0f172a" stroke="#ef4444" stroke-width="2" />
    <text x="110" y="45" fill="#f87171" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">Standard Build</text>
    <text x="110" y="110" fill="#fca5a5" font-family="monospace" font-size="28" font-weight="bold" text-anchor="middle">1.28 GB</text>
    <text x="110" y="150" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">Includes devDependencies</text>
    <text x="110" y="180" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">Uncached layers</text>
    <text x="110" y="210" fill="#ef4444" font-family="sans-serif" font-size="13" text-anchor="middle">Slow cold-starts</text>
  </g>
  <g transform="translate(440, 100)">
    <rect x="0" y="0" width="220" height="250" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <text x="110" y="45" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">Multi-Stage Alpine</text>
    <text x="110" y="110" fill="#4ade80" font-family="monospace" font-size="28" font-weight="bold" text-anchor="middle">18.4 MB</text>
    <text x="110" y="150" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">98.5% size reduction</text>
    <text x="110" y="180" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">Layer cached in CI</text>
    <text x="110" y="210" fill="#10b981" font-family="sans-serif" font-size="13" text-anchor="middle">Instant deployment</text>
  </g>
</svg>
