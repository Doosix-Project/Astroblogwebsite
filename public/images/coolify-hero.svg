<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCoolify" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgCoolify)" rx="16" />
  <circle cx="150" cy="100" r="120" fill="white" opacity="0.08" />
  <circle cx="700" cy="350" r="160" fill="white" opacity="0.05" />

  <!-- Cloud / Server Terminal Card -->
  <rect x="180" y="75" width="440" height="300" rx="16" fill="#0f172a" opacity="0.95" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  <!-- Window buttons -->
  <circle cx="215" cy="105" r="6" fill="#ef4444" />
  <circle cx="235" cy="105" r="6" fill="#f59e0b" />
  <circle cx="255" cy="105" r="6" fill="#10b981" />
  <text x="400" y="110" fill="#94a3b8" font-family="monospace" font-size="13" text-anchor="middle">coolify-deploy ~ v4.0</text>
  <line x1="180" y1="130" x2="620" y2="130" stroke="#334155" stroke-width="1" />

  <!-- Deployment console text -->
  <text x="210" y="170" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="bold">$ coolify app deploy --production</text>
  <text x="210" y="205" fill="#4ade80" font-family="monospace" font-size="14">✔ Repository pulled (main: 7a8f9c2)</text>
  <text x="210" y="235" fill="#4ade80" font-family="monospace" font-size="14">✔ Docker multi-stage build complete [12.4s]</text>
  <text x="210" y="265" fill="#4ade80" font-family="monospace" font-size="14">✔ Traefik SSL certificate provisioned</text>
  <text x="210" y="295" fill="#4ade80" font-family="monospace" font-size="14">✔ Zero-downtime healthcheck passed</text>
  <text x="210" y="335" fill="#f8fafc" font-family="monospace" font-size="15" font-weight="bold">🚀 Status: LIVE at https://blog.example.com</text>
</svg>
